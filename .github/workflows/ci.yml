name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC for AWS credentials

env:
  # Dummy values so modules import cleanly during lint/tests.
  ALPACA_API_KEY: test_key
  ALPACA_SECRET_KEY: test_secret
  ALPACA_PAPER: "true"
  GROK_API_KEY: test_grok_key
  MAX_DAILY_LOSS: "500"
  MAX_POSITION_RATIO: "0.5"
  API_SHARED_SECRET: test_shared_secret
  AWS_REGION: ap-northeast-1
  SAM_STACK_NAME: grok-trade

jobs:
  # ===========================================
  # Step 1: Lint & Type Check
  # ===========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Run Ruff
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Run MyPy
        working-directory: backend
        run: mypy . --ignore-missing-imports

  # ===========================================
  # Step 2: Unit Tests
  # ===========================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest tests/ \
            --ignore=tests/test_production_e2e.py \
            -v --tb=short \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=60 \
            --junitxml=test-results.xml

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: backend/test-results.xml
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml
          retention-days: 7

  # ===========================================
  # Step 3: Dashboard (Next.js) build check
  # ===========================================
  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Lint (if ESLint is configured)
        working-directory: dashboard
        run: |
          if ls .eslintrc* eslint.config.* >/dev/null 2>&1; then
            npx next lint
          else
            echo "No ESLint config found - skipping next lint"
          fi

      - name: Build
        working-directory: dashboard
        env:
          # Dummy values so the build (and its type-checked route handlers)
          # compile cleanly; no real backend/dashboard credentials needed.
          API_URL: http://localhost:8000
          API_SHARED_SECRET: ci-dummy-secret
          DASHBOARD_USER: ci-dummy-user
          DASHBOARD_PASSWORD: ci-dummy-password
        run: npm run build

  # ===========================================
  # Step 4: Validate & build the SAM stack (PR gate)
  # ===========================================
  build:
    name: SAM Validate & Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate template
        working-directory: backend
        run: sam validate --lint --region "$AWS_REGION"

      - name: Build Lambda packages
        working-directory: backend
        run: sam build

  # ===========================================
  # Step 5: Deploy to production (main only)
  # ===========================================
  deploy:
    name: Deploy (AWS SAM)
    runs-on: ubuntu-latest
    needs: [build, dashboard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM build
        working-directory: backend
        run: sam build

      - name: SAM deploy
        working-directory: backend
        run: |
          sam deploy \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show API URL
        working-directory: backend
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "API URL: $API_URL"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Resolve API shared secret from SSM
        id: secret
        run: |
          SECRET=$(aws ssm get-parameter --region "$AWS_REGION" \
            --name "/grok-trade/API_SHARED_SECRET" \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$SECRET"
          echo "api_shared_secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed API
        env:
          API_SHARED_SECRET: ${{ steps.secret.outputs.api_shared_secret }}
        run: |
          # F7: deploy.sh の手動デプロイと同じ基準で確認する - HTTP 200 では
          # なく /health の status が "ok" であること (secrets 未設定の
          # "degraded" は 200 を返すので、コード自体だけでは検出できない)。
          for i in 1 2 3 4 5; do
            HEALTH_BODY=$(curl -sf "${API_URL%/}/health" --max-time 30 || echo "")
            STATUS=$(echo "$HEALTH_BODY" | jq -r '.status // empty' 2>/dev/null || echo "")
            echo "attempt $i -> status=${STATUS:-<unreachable>}"
            [ "$STATUS" = "ok" ] && break
            if [ "$i" = 5 ]; then
              echo "Health check failed after deploy (status=${STATUS:-<unreachable>})"
              exit 1
            fi
            sleep 10
          done

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "x-api-key: $API_SHARED_SECRET" \
            "${API_URL%/}/status" --max-time 30 || echo 000)
          if [ "$STATUS_CODE" != "200" ]; then
            echo "/status (x-api-key 付き) が 200 を返さなかった (got $STATUS_CODE)"
            exit 1
          fi
          echo "/status (x-api-key 付き) が 200 を返した"
