name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  DATABASE_URL: "sqlite:///:memory:"
  ALPACA_API_KEY: test_key
  ALPACA_SECRET_KEY: test_secret
  ALPACA_PAPER: "true"
  GROK_API_KEY: test_grok_key
  MAX_DAILY_LOSS: "500"
  MAX_POSITION_RATIO: "0.5"
  FLY_APP_NAME: grok-trade-bot

jobs:
  # ===========================================
  # Step 1: Lint & Type Check
  # ===========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff
        working-directory: backend
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Run MyPy
        working-directory: backend
        run: mypy . --ignore-missing-imports
        continue-on-error: true

  # ===========================================
  # Step 2: Unit Tests
  # ===========================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest tests/ \
            --ignore=tests/test_production_e2e.py \
            -v --tb=short \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=60 \
            --junitxml=test-results.xml

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: backend/test-results.xml
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml
          retention-days: 7

  # ===========================================
  # Step 3: Deploy Preview (PRのみ)
  # ===========================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Preview
        id: deploy
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          PREVIEW_APP="grok-trade-pr-${{ github.event.pull_request.number }}"

          # アプリが存在するかチェック
          if ! flyctl apps list | grep -q "$PREVIEW_APP"; then
            echo "Creating preview app: $PREVIEW_APP"
            flyctl apps create "$PREVIEW_APP" --org personal || true
          fi

          # Secrets設定
          flyctl secrets set \
            ALPACA_API_KEY="${{ secrets.ALPACA_API_KEY }}" \
            ALPACA_SECRET_KEY="${{ secrets.ALPACA_SECRET_KEY }}" \
            ALPACA_PAPER="true" \
            GROK_API_KEY="${{ secrets.GROK_API_KEY }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            DISCORD_WEBHOOK_TRADES="${{ secrets.DISCORD_WEBHOOK_TRADES }}" \
            DISCORD_WEBHOOK_ALERTS="${{ secrets.DISCORD_WEBHOOK_ALERTS }}" \
            MAX_DAILY_LOSS="500" \
            MAX_POSITION_RATIO="0.5" \
            TRADING_INTERVAL="900" \
            TZ="America/New_York" \
            --app "$PREVIEW_APP" || true

          # デプロイ
          flyctl deploy --app "$PREVIEW_APP" --remote-only --wait-timeout 300

          # URL取得
          PREVIEW_URL="https://${PREVIEW_APP}.fly.dev"
          echo "url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "Preview deployed to: ${PREVIEW_URL}"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (url) {
              const comments = await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              const botComment = comments.data.find(c =>
                c.user.type === 'Bot' && c.body.includes('Preview Deployment')
              );

              const body = `## 🚀 Preview Deployment

            **URL:** ${url}

            | Endpoint | Link |
            |----------|------|
            | Health | [${url}/health](${url}/health) |
            | Status | [${url}/status](${url}/status) |
            | Trades | [${url}/trades](${url}/trades) |

            > ⚠️ This preview uses **paper trading** mode.
            > Preview will be deleted when PR is closed.`;

              if (botComment) {
                await github.rest.issues.updateComment({
                  comment_id: botComment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            }

  # ===========================================
  # Step 4: E2E Tests on Preview
  # ===========================================
  e2e-preview:
    name: E2E Tests (Preview)
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for Preview to be ready
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.url }}"
          echo "Waiting for ${PREVIEW_URL}/health..."
          for i in {1..30}; do
            if curl -sf "${PREVIEW_URL}/health" | grep -q "ok"; then
              echo "Preview is ready!"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 10
          done
          echo "Preview not ready after 5 minutes"
          exit 1

      - name: Run E2E Tests
        id: e2e
        working-directory: backend
        env:
          PRODUCTION_API_URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          set +e
          pytest tests/test_production_e2e.py -v --tb=short --junitxml=e2e-results.xml 2>&1 | tee e2e-output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Extract test summary
          PASSED=$(grep -oP '\d+(?= passed)' e2e-output.txt | head -1 || echo "0")
          FAILED=$(grep -oP '\d+(?= failed)' e2e-output.txt | head -1 || echo "0")
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT

          exit $EXIT_CODE
        continue-on-error: true

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preview-results
          path: backend/e2e-results.xml
          retention-days: 7

      - name: Test endpoints directly
        id: endpoints
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          echo "Testing endpoints..."
          # Only output emoji status, not the full response (to avoid breaking JS)
          if curl -sf "$PREVIEW_URL/health" > /dev/null 2>&1; then
            echo "health=✅" >> $GITHUB_OUTPUT
          else
            echo "health=❌" >> $GITHUB_OUTPUT
          fi

          if curl -sf "$PREVIEW_URL/status" > /dev/null 2>&1; then
            echo "status=✅" >> $GITHUB_OUTPUT
          else
            echo "status=❌" >> $GITHUB_OUTPUT
          fi

          if curl -sf "$PREVIEW_URL/trades" > /dev/null 2>&1; then
            echo "trades=✅" >> $GITHUB_OUTPUT
          else
            echo "trades=❌" >> $GITHUB_OUTPUT
          fi

          if curl -sf "$PREVIEW_URL/decisions" > /dev/null 2>&1; then
            echo "decisions=✅" >> $GITHUB_OUTPUT
          else
            echo "decisions=❌" >> $GITHUB_OUTPUT
          fi

      - name: Update PR comment with test results
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ needs.deploy-preview.outputs.url }}';
            const passed = '${{ steps.e2e.outputs.passed }}' || '0';
            const failed = '${{ steps.e2e.outputs.failed }}' || '0';
            const exitCode = '${{ steps.e2e.outputs.exit_code }}';
            const health = '${{ steps.endpoints.outputs.health }}';
            const status = '${{ steps.endpoints.outputs.status }}';
            const trades = '${{ steps.endpoints.outputs.trades }}';
            const decisions = '${{ steps.endpoints.outputs.decisions }}';

            const testStatus = exitCode === '0' ? '✅ All tests passed' : `⚠️ ${failed} test(s) failed`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            const body = `## 🚀 Preview Deployment

            **URL:** ${url}

            ### Endpoint Tests
            | Endpoint | Status | Link |
            |----------|--------|------|
            | /health | ${health} | [Open](${url}/health) |
            | /status | ${status} | [Open](${url}/status) |
            | /trades | ${trades} | [Open](${url}/trades) |
            | /decisions | ${decisions} | [Open](${url}/decisions) |

            ### E2E Test Results
            ${testStatus} (${passed} passed, ${failed} failed)

            > ⚠️ This preview uses **paper trading** mode.
            > Preview will be deleted when PR is closed.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # ===========================================
  # Step 5: Deploy Production (mainマージ後)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://grok-trade-bot.fly.dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Production
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Secrets設定（初回のみ必要、以降は既存設定を使用）
          flyctl secrets set \
            ALPACA_API_KEY="${{ secrets.ALPACA_API_KEY }}" \
            ALPACA_SECRET_KEY="${{ secrets.ALPACA_SECRET_KEY }}" \
            ALPACA_PAPER="true" \
            GROK_API_KEY="${{ secrets.GROK_API_KEY }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            DISCORD_WEBHOOK_TRADES="${{ secrets.DISCORD_WEBHOOK_TRADES }}" \
            DISCORD_WEBHOOK_ALERTS="${{ secrets.DISCORD_WEBHOOK_ALERTS }}" \
            MAX_DAILY_LOSS="${{ secrets.MAX_DAILY_LOSS }}" \
            MAX_POSITION_RATIO="${{ secrets.MAX_POSITION_RATIO }}" \
            TRADING_INTERVAL="${{ secrets.TRADING_INTERVAL }}" \
            TZ="America/New_York" \
            --app grok-trade-bot || true

          # デプロイ
          flyctl deploy --app grok-trade-bot --remote-only --wait-timeout 300

          echo "Production deployed to: https://grok-trade-bot.fly.dev"

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"content\": \"✅ **Grok Trade**: 本番デプロイ完了\\nCommit: ${{ github.sha }}\\nURL: https://grok-trade-bot.fly.dev\"}" \
              "$DISCORD_WEBHOOK"
          fi
        continue-on-error: true

  # ===========================================
  # Step 6: E2E Tests on Production
  # ===========================================
  e2e-production:
    name: E2E Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for Production to be ready
        run: |
          PROD_URL="https://grok-trade-bot.fly.dev"
          echo "Waiting for ${PROD_URL}/health..."
          for i in {1..30}; do
            if curl -sf "${PROD_URL}/health" | grep -q "ok"; then
              echo "Production is ready!"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 10
          done
          echo "Production not ready after 5 minutes"
          exit 1

      - name: Run E2E Tests
        working-directory: backend
        env:
          PRODUCTION_API_URL: https://grok-trade-bot.fly.dev
        run: |
          pytest tests/test_production_e2e.py -v --tb=short --junitxml=e2e-production-results.xml

      - name: Upload E2E production results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-production-results
          path: backend/e2e-production-results.xml
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"content\": \"🚨 **Grok Trade**: 本番E2Eテスト失敗\\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK"
          fi

  # ===========================================
  # Cleanup: Delete Preview Environment
  # ===========================================
  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Delete Preview App
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          PREVIEW_APP="grok-trade-pr-${{ github.event.pull_request.number }}"
          echo "Deleting preview app: $PREVIEW_APP"
          flyctl apps destroy "$PREVIEW_APP" --yes || echo "App not found or already deleted"
          echo "Preview cleanup complete"
