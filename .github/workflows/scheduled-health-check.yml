name: Scheduled Health Check

on:
  schedule:
    # 毎時実行（本番環境のヘルスチェック）
    - cron: "0 * * * *"
    # 毎日 JST 22:30 (米国市場終了前) に E2E テスト実行
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for AWS credentials

env:
  AWS_REGION: ap-northeast-1
  SAM_STACK_NAME: grok-trade
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

jobs:
  health-check:
    name: API Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve API URL from stack output
        id: url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          # Function URLs carry a trailing slash; strip it so callers can append paths
          echo "api_url=${API_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Check API health
        env:
          API_URL: ${{ steps.url.outputs.api_url }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL%/}/health" --max-time 30)
          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed with status $RESPONSE"
            exit 1
          fi

      - name: Check scheduler status
        env:
          API_URL: ${{ steps.url.outputs.api_url }}
        run: |
          HEALTH_BODY=$(curl -sf "${API_URL%/}/health" --max-time 30)
          echo "Health response: $HEALTH_BODY"
          echo "Scheduler running: $(echo "$HEALTH_BODY" | jq -r '.scheduler_running')"

      - name: Resolve API shared secret from SSM
        id: secret
        run: |
          SECRET=$(aws ssm get-parameter --region "$AWS_REGION" \
            --name "/grok-trade/API_SHARED_SECRET" \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$SECRET"
          echo "api_shared_secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Verify the trading cycle actually ran recently
        env:
          API_URL: ${{ steps.url.outputs.api_url }}
          API_SHARED_SECRET: ${{ steps.secret.outputs.api_shared_secret }}
        run: |
          # trading_cycle and emergency_check share one Lambda function
          # (grok-trade-trading), so the function's total Invocations metric
          # can't tell them apart - emergency_check's own 5-min pings keep
          # that count non-zero even if trading_cycle is silently broken.
          # Only trading_cycle writes a PIPELINE item (log_pipeline());
          # emergency_check doesn't, so the most recent PIPELINE item's
          # timestamp is a trading_cycle-specific "did it actually run"
          # signal (E7), unlike the raw invocation count.
          #
          # This is meaningful only during the trading session; outside it
          # "no recent run" is expected and alerting on it would page every
          # night and all weekend.
          DOW=$(TZ=America/New_York date '+%u')
          HOUR=$(TZ=America/New_York date '+%-H')
          if [ "$DOW" -gt 5 ] || [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 16 ]; then
            echo "Outside market hours (ET $(TZ=America/New_York date '+%a %H:%M')) - skipping"
            exit 0
          fi

          LATEST=$(curl -sf -H "x-api-key: $API_SHARED_SECRET" \
            "${API_URL%/}/pipeline?limit=1" --max-time 30)
          TIMESTAMP=$(echo "$LATEST" | jq -r '.logs[0].timestamp // empty')
          if [ -z "$TIMESTAMP" ]; then
            echo "⚠️ No trading_cycle pipeline log entries found at all"
            exit 1
          fi

          LATEST_EPOCH=$(date -u -d "$TIMESTAMP" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_MIN=$(( (NOW_EPOCH - LATEST_EPOCH) / 60 ))
          echo "Most recent trading_cycle pipeline log: $TIMESTAMP ($AGE_MIN min ago)"
          if [ "$AGE_MIN" -gt 45 ]; then
            echo "⚠️ Trading cycle has not run in the last 45 minutes (last: $AGE_MIN min ago)"
            exit 1
          fi

          # trading_cycle()/emergency_check() now re-raise after notifying
          # Discord (Issues #9, E2), instead of swallowing every failure - so
          # a real error in either task surfaces here as a Lambda Errors
          # metric point, not just silence. This covers the whole function
          # (both tasks share it), which is fine: any error here is worth
          # surfacing regardless of which task raised it.
          ERRORS=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Errors \
            --dimensions Name=FunctionName,Value=grok-trade-trading \
            --start-time "$(date -u -d '1 hour ago' '+%Y-%m-%dT%H:%M:%SZ')" \
            --end-time "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --period 3600 --statistics Sum \
            --region "$AWS_REGION" \
            --query 'Datapoints[0].Sum' --output text)
          echo "Trading Lambda errors in last hour: $ERRORS"
          if [ "$ERRORS" != "None" ] && [ -n "$ERRORS" ] && [ "$(printf '%.0f' "$ERRORS")" -gt 0 ]; then
            echo "❌ Trading Lambda reported $ERRORS error(s) in the last hour"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade**: ヘルスチェック失敗\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi

  # 平日 22:30 JST に E2E テスト実行
  daily-e2e:
    name: Daily E2E Tests
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 13 * * 1-5' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve API URL from stack output
        id: url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          # Function URLs carry a trailing slash; strip it so callers can append paths
          echo "api_url=${API_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Resolve API shared secret from SSM
        id: secret
        run: |
          # Every endpoint except /health now requires x-api-key (Issue #1),
          # so test_production_e2e.py needs this to test anything past /health.
          SECRET=$(aws ssm get-parameter --region "$AWS_REGION" \
            --name "/grok-trade/API_SHARED_SECRET" \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$SECRET"
          echo "api_shared_secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Run E2E Tests
        working-directory: backend
        env:
          PRODUCTION_API_URL: ${{ steps.url.outputs.api_url }}
          PRODUCTION_API_SHARED_SECRET: ${{ steps.secret.outputs.api_shared_secret }}
        run: |
          pytest tests/test_production_e2e.py -v --tb=short

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade**: Daily E2Eテスト失敗\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi

      - name: Notify on success
        if: success()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "✅ **Grok Trade**: Daily E2Eテスト成功\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'"}' \
              "$DISCORD_WEBHOOK"
          fi
