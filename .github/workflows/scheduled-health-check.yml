name: Scheduled Health Check

on:
  schedule:
    # 毎時実行（本番環境のヘルスチェック）- 市場開場ラッシュを避ける
    # 14:00-15:00 UTC (9:00-10:00 AM ET) は避ける
    - cron: '0 0-13,16-23 * * *'  # 14,15時以外の毎時
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PRODUCTION_URL: ${{ secrets.PRODUCTION_API_URL }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  health-check:
    name: API Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check API health
        id: health
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "⚠️ PRODUCTION_API_URL not configured"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/health" --max-time 30)
          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API is healthy"
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "❌ API health check failed with status $RESPONSE"
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Get detailed status
        if: steps.health.outputs.status == 'healthy'
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            echo "📊 Fetching detailed status..."
            curl -s "$PRODUCTION_URL/status" | jq '.' || echo "Could not parse status"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade Bot**: APIヘルスチェック失敗\n環境: Production\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi

  weekly-full-test:
    name: Weekly Full Test Suite
    runs-on: ubuntu-latest
    # 毎週日曜 UTC 0:00 に実行
    if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
    env:
      DATABASE_URL: "sqlite:///:memory:"
      ALPACA_API_KEY: "test_key"
      ALPACA_SECRET_KEY: "test_secret"
      ALPACA_PAPER: "true"
      GROK_API_KEY: "test_grok_key"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run full test suite
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=html --cov-report=term-missing

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 30

      - name: Notify success
        if: success()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "✅ **Grok Trade Bot**: 週次フルテスト完了\n結果: 全テスト成功\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi
        continue-on-error: true
