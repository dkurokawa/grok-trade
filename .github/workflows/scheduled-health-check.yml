name: Scheduled Health Check

on:
  schedule:
    # 毎時実行（本番環境のヘルスチェック）
    # JST 10:00-翌5:00 = UTC 1:00-20:00 (米国市場時間帯)
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  PRODUCTION_URL: https://grok-trade-bot.fly.dev
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

jobs:
  health-check:
    name: API Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check API health
        id: health
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "⚠️ PRODUCTION_API_URL not configured"
            exit 0
          fi

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/health" --max-time 30)
          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed with status $RESPONSE"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade**: ヘルスチェック失敗\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi
