name: Scheduled Health Check

on:
  schedule:
    # 毎時実行（本番環境のヘルスチェック）
    - cron: "0 * * * *"
    # 毎日 JST 22:30 (米国市場終了前) に E2E テスト実行
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for AWS credentials

env:
  AWS_REGION: ap-northeast-1
  SAM_STACK_NAME: grok-trade
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

jobs:
  health-check:
    name: API Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve API URL from stack output
        id: url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          # Function URLs carry a trailing slash; strip it so callers can append paths
          echo "api_url=${API_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Check API health
        env:
          API_URL: ${{ steps.url.outputs.api_url }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL%/}/health" --max-time 30)
          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed with status $RESPONSE"
            exit 1
          fi

      - name: Check scheduler status
        env:
          API_URL: ${{ steps.url.outputs.api_url }}
        run: |
          HEALTH_BODY=$(curl -sf "${API_URL%/}/health" --max-time 30)
          echo "Health response: $HEALTH_BODY"
          echo "Scheduler running: $(echo "$HEALTH_BODY" | jq -r '.scheduler_running')"

      - name: Verify the trading schedule actually fired
        run: |
          # EventBridge Scheduler drives the 30-min cycle on weekdays 09:00-15:30 ET.
          # This check looks at the previous hour, so it is only meaningful from
          # 10:00 to 16:00 ET; outside that window "no invocations" is expected
          # and alerting on it would page every night and all weekend.
          DOW=$(TZ=America/New_York date '+%u')
          HOUR=$(TZ=America/New_York date '+%-H')
          if [ "$DOW" -gt 5 ] || [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 16 ]; then
            echo "Outside market hours (ET $(TZ=America/New_York date '+%a %H:%M')) - skipping"
            exit 0
          fi
          INVOCATIONS=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Invocations \
            --dimensions Name=FunctionName,Value=grok-trade-trading \
            --start-time "$(date -u -d '1 hour ago' '+%Y-%m-%dT%H:%M:%SZ')" \
            --end-time "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --period 3600 --statistics Sum \
            --region "$AWS_REGION" \
            --query 'Datapoints[0].Sum' --output text)
          echo "Trading Lambda invocations in last hour: $INVOCATIONS"
          if [ "$INVOCATIONS" = "None" ] || [ -z "$INVOCATIONS" ]; then
            echo "⚠️ No trading Lambda invocations in the last hour"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade**: ヘルスチェック失敗\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi

  # 平日 22:30 JST に E2E テスト実行
  daily-e2e:
    name: Daily E2E Tests
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 13 * * 1-5' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve API URL from stack output
        id: url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          # Function URLs carry a trailing slash; strip it so callers can append paths
          echo "api_url=${API_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run E2E Tests
        working-directory: backend
        env:
          PRODUCTION_API_URL: ${{ steps.url.outputs.api_url }}
        run: |
          pytest tests/test_production_e2e.py -v --tb=short

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade**: Daily E2Eテスト失敗\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi

      - name: Notify on success
        if: success()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "✅ **Grok Trade**: Daily E2Eテスト成功\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'"}' \
              "$DISCORD_WEBHOOK"
          fi
