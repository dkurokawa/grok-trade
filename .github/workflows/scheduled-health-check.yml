name: Scheduled Health Check

on:
  schedule:
    # 毎時実行（本番環境のヘルスチェック）
    # JST 10:00-翌5:00 = UTC 1:00-20:00 (米国市場時間帯)
    - cron: "0 * * * *"
    # 毎日 JST 22:30 (米国市場終了前) に E2E テスト実行
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

env:
  PRODUCTION_URL: https://grok-trade-bot.fly.dev
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

jobs:
  health-check:
    name: API Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check API health
        id: health
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "⚠️ PRODUCTION_API_URL not configured"
            exit 0
          fi

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/health" --max-time 30)
          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed with status $RESPONSE"
            exit 1
          fi

      - name: Check scheduler status
        run: |
          HEALTH_BODY=$(curl -sf "$PRODUCTION_URL/health" --max-time 30)
          echo "Health response: $HEALTH_BODY"

          SCHEDULER=$(echo "$HEALTH_BODY" | jq -r '.scheduler_running')
          echo "Scheduler running: $SCHEDULER"

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade**: ヘルスチェック失敗\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi

  # 平日 22:30 JST に E2E テスト実行
  daily-e2e:
    name: Daily E2E Tests
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 13 * * 1-5' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run E2E Tests
        working-directory: backend
        env:
          PRODUCTION_API_URL: https://grok-trade-bot.fly.dev
        run: |
          pytest tests/test_production_e2e.py -v --tb=short

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **Grok Trade**: Daily E2Eテスト失敗\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'\n詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$DISCORD_WEBHOOK"
          fi

      - name: Notify on success
        if: success()
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "✅ **Grok Trade**: Daily E2Eテスト成功\n時刻: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'"}' \
              "$DISCORD_WEBHOOK"
          fi
