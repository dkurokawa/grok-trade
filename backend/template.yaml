AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Grok Trade Bot - serverless.
  EventBridge Scheduler -> pipeline Lambda (Grok report -> Grok/Opus decision -> Risk Guard -> Alpaca);
  Function URL -> API Lambda; DynamoDB (on-demand).

Parameters:
  AlpacaPaper:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Use Alpaca paper trading.
  AlpacaDataFeed:
    Type: String
    Default: iex
    AllowedValues: [iex, sip]
    Description: Market data feed. The free Alpaca plan only serves iex.
  DecisionEngine:
    Type: String
    Default: grok
    AllowedValues: [grok, opus]
    Description: >
      Which model makes the Stage 2 trade decision.
      grok = Grok decides from its own report; opus = Claude Opus decides (needs ANTHROPIC_API_KEY in SSM).
  GrokModel:
    Type: String
    Default: grok-3-mini
  MaxDailyLoss:
    Type: String
    Default: "500"
  MaxPositionRatio:
    Type: String
    Default: "0.5"
  MaxSingleTradePct:
    Type: String
    Default: "0.25"
  MinConfidence:
    Type: String
    Default: "40"
    Description: Risk Guard blocks decisions below this confidence.
  TableName:
    Type: String
    Default: grok-trade
  SsmPrefix:
    Type: String
    Default: /grok-trade
    Description: SSM Parameter Store prefix holding the SecureString secrets.

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    CodeUri: ./
    Environment:
      Variables:
        ENVIRONMENT: production
        DDB_TABLE: !Ref TableName
        SSM_PREFIX: !Ref SsmPrefix
        ALPACA_PAPER: !Ref AlpacaPaper
        ALPACA_DATA_FEED: !Ref AlpacaDataFeed
        DECISION_ENGINE: !Ref DecisionEngine
        GROK_MODEL: !Ref GrokModel
        MAX_DAILY_LOSS: !Ref MaxDailyLoss
        MAX_POSITION_RATIO: !Ref MaxPositionRatio
        MAX_SINGLE_TRADE_PCT: !Ref MaxSingleTradePct
        MIN_CONFIDENCE: !Ref MinConfidence

Resources:
  TradeTable:
    Type: AWS::DynamoDB::Table
    # Holds all trade and pipeline history under an explicit TableName, so a
    # TableName change or a stack rollback would otherwise delete it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Scheduled jobs (EventBridge Scheduler -> Lambda). Market hours only, New York time.
  TradingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: grok-trade-trading
      Handler: lambda_trading.handler
      Timeout: 180   # two model calls (report + decision) plus Alpaca round-trips
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}*"
      Events:
        # 9:30-15:30, every 30 min - the actual US market session, not
        # 9:00-15:30 (the market doesn't open until 9:30 ET). Split into two
        # schedules since a single cron field can't express ":30 on the open
        # hour, :00 and :30 on every hour after" in one expression.
        # Input carries EventBridge Scheduler's own <aws.scheduler.scheduled-time>
        # (the intended fire time) so lambda_trading.handler can key the slot
        # off that instead of "whenever this Lambda actually started" - a
        # cold-start/queueing delay that crosses a slot boundary must not
        # split one scheduled firing into two different slots/client_order_ids.
        TradingCycleOpen:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 9 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"task": "trading_cycle", "scheduled_time": "<aws.scheduler.scheduled-time>"}'
        TradingCycle:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0,30 10-15 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"task": "trading_cycle", "scheduled_time": "<aws.scheduler.scheduled-time>"}'
        # 9:30-15:55, every 5 min - same reasoning, split for the same reason.
        EmergencyCheckOpen:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30,35,40,45,50,55 9 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"task": "emergency_check", "scheduled_time": "<aws.scheduler.scheduled-time>"}'
        EmergencyCheck:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 10-15 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"task": "emergency_check", "scheduled_time": "<aws.scheduler.scheduled-time>"}'
    Metadata:
      BuildMethod: makefile   # cross-compiles Linux wheels without Docker

  # Dashboard-facing API (Function URL -> Lambda, FastAPI via Mangum)
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: grok-trade-api
      Handler: app.handler
      Timeout: 30
      MemorySize: 256
      FunctionUrlConfig:
        AuthType: NONE
        # No Cors block: the browser never calls this URL directly. The
        # dashboard's Next.js server proxies every call and attaches
        # x-api-key server-side (see app.py's _require_secret).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}*"
    Metadata:
      BuildMethod: makefile   # cross-compiles Linux wheels without Docker

Outputs:
  ApiUrl:
    Description: Function URL for the dashboard API (set as the dashboard's server-only API_URL - never NEXT_PUBLIC_).
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref TableName
