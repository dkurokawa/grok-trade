app = 'grok-trade-bot'
primary_region = 'nrt'  # Tokyo

[build]

[env]
  PORT = '8080'
  TZ = 'America/New_York'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'  # 常時起動
  auto_start_machines = true
  min_machines_running = 1    # 最低1台は常に起動

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  timeout = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
